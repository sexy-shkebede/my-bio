<script>
  // Ранняя установка темы, оттенка и режима насыщенности без мигания
  try {
    var d = document.documentElement,
        h = localStorage.getItem('shkbd:hue'),
        t = localStorage.getItem('shkbd:theme'),
        v = localStorage.getItem('shkbd:vib');
    if (h) d.style.setProperty('--h', h);
    if (t) d.dataset.theme = t;
    if (v) d.dataset.vib = v;
  } catch (e) {}
  document.documentElement.classList.add('pre');
</script>
<style>
@property --h { syntax: '<number>'; inherits: true; initial-value: 350; }
@property --c-boost { syntax: '<number>'; inherits: true; initial-value: 1; }

:root {
  color-scheme: light dark;
  --h: 350;
  --c-boost: 1;

  /* Цвет блока комментариев — как на старом сайте */
  --comments-bg: light-dark(#FFFFFF, #15202B);

  /* Динамическая схема M3 Expressive из оттенка --h и множителя насыщенности --c-boost (OKLCH) */
  --primary:                light-dark(oklch(50% calc(.19 * var(--c-boost)) var(--h)),  oklch(82% calc(.13 * var(--c-boost)) var(--h)));
  --on-primary:             light-dark(oklch(99% .008 var(--h)),                        oklch(25% calc(.10 * var(--c-boost)) var(--h)));
  --primary-container:      light-dark(oklch(89% calc(.085 * var(--c-boost)) var(--h)), oklch(34% calc(.12 * var(--c-boost)) var(--h)));
  --on-primary-container:   light-dark(oklch(25% calc(.11 * var(--c-boost)) var(--h)),  oklch(93% calc(.055 * var(--c-boost)) var(--h)));
  --secondary-container:    light-dark(oklch(91.5% calc(.045 * var(--c-boost)) var(--h)), oklch(29% calc(.045 * var(--c-boost)) var(--h)));
  --on-secondary-container: light-dark(oklch(26% calc(.05 * var(--c-boost)) var(--h)),  oklch(92% .03 var(--h)));
  --tertiary-container:     light-dark(oklch(90% calc(.085 * var(--c-boost)) calc(var(--h) + 75)), oklch(34% calc(.095 * var(--c-boost)) calc(var(--h) + 75)));
  --on-tertiary-container:  light-dark(oklch(26% calc(.09 * var(--c-boost)) calc(var(--h) + 75)),  oklch(93% .05 calc(var(--h) + 75)));
  --surface:                light-dark(oklch(98.5% .008 var(--h)), oklch(14.5% .014 var(--h)));
  --surface-2:              light-dark(oklch(95.5% .014 var(--h)), oklch(19.5% .016 var(--h)));
  --surface-3:              light-dark(oklch(92.5% .022 var(--h)), oklch(24.5% .02 var(--h)));
  --on-surface:             light-dark(oklch(20% .02 var(--h)),    oklch(93.5% .012 var(--h)));
  --on-surface-variant:     light-dark(oklch(44% .025 var(--h)),   oklch(77% .022 var(--h)));
  --outline-variant:        light-dark(oklch(84% .025 var(--h)),   oklch(33% .025 var(--h)));
  --error:                  light-dark(oklch(56% .21 27),          oklch(74% .16 27));
  --ok:                     light-dark(oklch(55% .17 148),         oklch(78% .15 148));
  --warn:                   light-dark(oklch(62% .17 75),          oklch(82% .15 75));

  --emph: cubic-bezier(.2, 0, 0, 1);
  --spring: cubic-bezier(.34, 1.5, .5, 1);
  --spring-soft: cubic-bezier(.3, 1.15, .5, 1);
}

@supports (transition-timing-function: linear(0, 1)) {
  :root {
    --spring: linear(0, 0.009, 0.035 2.1%, 0.141 4.4%, 0.723 12.9%, 0.938 16.7%, 1.017 19.4%, 1.077 22.4%, 1.121 25.4%, 1.149 28.6%, 1.159 31.5%, 1.155 34.5%, 1.129 38.3%, 1.051 45.6%, 1.017 49.3%, 0.991 53.9%, 0.977 58.3%, 0.974 62.7%, 0.997 77.9%, 1.003 87.1%, 1);
    --spring-soft: linear(0, 0.006, 0.025 2.8%, 0.101 6.1%, 0.539 18.9%, 0.721 25.3%, 0.849 31.5%, 0.937 38.1%, 0.968 41.8%, 0.991 45.7%, 1.006 50.1%, 1.015 55%, 1.017 63.9%, 1.001 85.9%, 1);
  }
}

:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"]  { color-scheme: dark; }
:root[data-vib="tonal"]   { --c-boost: 0.65; }
:root[data-vib="expressive"] { --c-boost: 1; }
:root[data-vib="vibrant"] { --c-boost: 1.32; }
:root.ready { transition: --h .85s var(--emph), --c-boost .5s var(--emph); }

*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }
html { height: 100%; -webkit-text-size-adjust: 100%; background: var(--surface); }
body {
  min-height: 100%;
  background: var(--surface);
  color: var(--on-surface);
  font: 400 16px/1.5 'Roboto Flex', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: inherit; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }

.ms {
  font-family: 'Material Symbols Rounded';
  font-weight: normal; font-style: normal; font-size: 24px; line-height: 1;
  letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr;
  display: inline-block; width: 1em; overflow: hidden; user-select: none;
  font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased;
  font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
}

.wrap { max-width: 1040px; margin: 0 auto; padding: 12px 16px 36px; }

/* ---------- M3 Expressive Floating Top Bar ---------- */
.bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 8px 6px 18px; margin-bottom: 14px;
  background: var(--surface-2);
  border-radius: 999px;
  position: relative; z-index: 10;
}
.wordmark {
  display: inline-flex; align-items: center; gap: 10px;
  font-size: 20px; letter-spacing: -.01em; text-decoration: none;
  font-variation-settings: 'wdth' 130, 'wght' 780, 'opsz' 20;
  transition: font-variation-settings .4s var(--spring);
}
.wordmark:hover { font-variation-settings: 'wdth' 151, 'wght' 900, 'opsz' 20; }
.wordmark-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--primary);
  transition: transform .45s var(--spring), border-radius .45s var(--spring);
}
.wordmark:hover .wordmark-dot { transform: scale(1.4) rotate(45deg); border-radius: 3px; }

.bar-actions { display: flex; gap: 6px; position: relative; }
.icon-btn {
  width: 44px; height: 44px; border: 0; border-radius: 22px;
  background: var(--surface-3); display: grid; place-items: center;
  transition: border-radius .45s var(--spring), background-color .2s, transform .35s var(--spring);
}
.icon-btn:hover { background: var(--primary-container); color: var(--on-primary-container); }
.icon-btn:active, .icon-btn[aria-expanded="true"] { border-radius: 13px; transform: scale(.94); }

/* ---------- Прокачанная палитра M3 ---------- */
.palette {
  position: absolute; top: calc(100% + 12px); right: 0;
  display: flex; flex-direction: column; gap: 12px;
  padding: 14px; border-radius: 28px; min-width: 268px;
  background: var(--surface-3);
  border: 1px solid var(--outline-variant);
  box-shadow: 0 16px 40px -12px oklch(0% 0 0 / .45);
  transform-origin: top right; transform: scale(.65) translateY(-10px); opacity: 0; visibility: hidden;
  transition: transform .5s var(--spring), opacity .2s, visibility 0s .5s;
}
.palette.open {
  transform: none; opacity: 1; visibility: visible;
  transition: transform .5s var(--spring), opacity .15s, visibility 0s;
}
.pal-row { display: flex; justify-content: space-between; gap: 8px; }
.sw {
  width: 42px; height: 42px; border: 0; border-radius: 21px;
  background: oklch(64% .18 var(--sh)); color: #fff;
  display: grid; place-items: center;
  transition: border-radius .5s var(--spring), transform .5s var(--spring);
}
.sw .ms { font-size: 20px; opacity: 0; transform: scale(.4); transition: opacity .2s, transform .4s var(--spring); }
.sw[aria-checked="true"] { border-radius: 12px; transform: scale(1.06); }
.sw[aria-checked="true"] .ms { opacity: 1; transform: none; }
.sw:active { transform: scale(.86); }

.hue-wrap { display: flex; flex-direction: column; gap: 6px; }
.hue-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--on-surface-variant); font-variation-settings: 'wght' 600; }
.hue-slider {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 18px; border-radius: 999px; outline: none;
  background: linear-gradient(to right in oklch longer hue, oklch(68% .18 0), oklch(68% .18 360));
  cursor: pointer;
}
.hue-slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 24px; height: 24px; border-radius: 8px;
  background: var(--on-surface); border: 3px solid var(--surface-3);
  box-shadow: 0 2px 6px oklch(0% 0 0 / .35);
  transition: border-radius .3s var(--spring), transform .3s var(--spring);
}
.hue-slider::-webkit-slider-thumb:hover { transform: scale(1.12); border-radius: 50%; }

.vib-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 16px; }
.vib-btn {
  border: 0; background: transparent; padding: 6px 8px; border-radius: 12px;
  font-size: 12px; font-variation-settings: 'wght' 620; color: var(--on-surface-variant);
  transition: background-color .2s, color .2s, border-radius .35s var(--spring);
}
.vib-btn[aria-pressed="true"] {
  background: var(--primary); color: var(--on-primary); border-radius: 999px;
}

/* ---------- Bento Grid ---------- */
.grid { display: grid; gap: 12px; }
.card { padding: 24px; position: relative; overflow: hidden; }

/* ---------- Hero ---------- */
.hero {
  background: var(--primary-container); color: var(--on-primary-container);
  border-radius: 48px; display: flex; flex-direction: column; justify-content: space-between; gap: 28px;
  container-type: inline-size; isolation: isolate;
}
.hero-ambient {
  position: absolute; right: -12%; top: -18%; width: clamp(220px, 58cqi, 380px); aspect-ratio: 1;
  fill: color-mix(in oklab, var(--primary) 18%, transparent);
  pointer-events: none; z-index: -1;
  animation: spin 90s linear infinite reverse;
}
.hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.avatar {
  position: relative; border: 0; padding: 0; background: none;
  width: clamp(112px, 34cqi, 184px); aspect-ratio: 1; border-radius: 50%;
  transition: transform .45s var(--spring);
}
.avatar:hover { transform: scale(1.04); }
.avatar:active { transform: scale(.94); }
.avatar-shape {
  position: relative; display: block; width: 100%; height: 100%;
  background: var(--primary);
  -webkit-clip-path: url(#avatarClip); clip-path: url(#avatarClip);
  animation: spin 60s linear infinite;
}
.avatar img, .avatar-fallback {
  display: block; width: 100%; height: 100%; object-fit: cover;
  animation: spin 60s linear infinite reverse;
}
.avatar-fallback {
  display: none; position: absolute; inset: 0; place-items: center;
  color: var(--on-primary); font-size: 64px; font-variation-settings: 'wdth' 151, 'wght' 900;
}
.noimg img { display: none; }
.noimg .avatar-fallback { display: grid; }
@keyframes spin { to { transform: rotate(1turn); } }

.shape-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: 999px; border: 0;
  background: color-mix(in oklab, var(--on-primary-container) 10%, transparent);
  color: var(--on-primary-container);
  font-size: 13px; font-variation-settings: 'wdth' 110, 'wght' 650;
  transition: transform .4s var(--spring), background-color .2s, border-radius .4s var(--spring);
}
.shape-pill:hover { background: color-mix(in oklab, var(--on-primary-container) 16%, transparent); }
.shape-pill:active { transform: scale(.92); border-radius: 10px; }
.shape-pill .ms { font-size: 16px; }

.name {
  --n-wdth: 151;
  --n-wght: 900;
  font-size: clamp(56px, 21cqi, 152px); line-height: .84; letter-spacing: -.025em; margin-left: -.04em;
  font-weight: 900;
  font-variation-settings: 'wdth' var(--n-wdth), 'wght' var(--n-wght), 'opsz' 144;
  transition: font-variation-settings .9s var(--spring-soft), letter-spacing 1.2s var(--spring-soft);
  user-select: none;
}
.pre .name { font-variation-settings: 'wdth' 30, 'wght' 200, 'opsz' 144; letter-spacing: .02em; }

.role {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 14px;
  font-size: clamp(18px, 5.4cqi, 24px); font-variation-settings: 'wdth' 110, 'wght' 520;
}
.tag {
  font-size: 15px; font-variation-settings: 'wdth' 105, 'wght' 680;
  background: var(--primary); color: var(--on-primary);
  padding: 5px 15px 6px; border-radius: 999px;
  transition: border-radius .4s var(--spring), transform .4s var(--spring);
}
.tag:hover { border-radius: 10px; transform: scale(1.05); }

/* ---------- Clock ---------- */
.clock {
  background: var(--tertiary-container); color: var(--on-tertiary-container);
  border-radius: 36px; container-type: inline-size;
  display: flex; flex-direction: column; justify-content: space-between;
}
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.label { font-size: 15px; font-weight: 600; font-variation-settings: 'wdth' 105, 'wght' 620; opacity: .82; }
.tz-badge {
  font-size: 12px; padding: 2px 10px; border-radius: 999px;
  background: color-mix(in oklab, currentColor 10%, transparent);
  font-variation-settings: 'wdth' 100, 'wght' 600;
}
.digits {
  display: flex; align-items: baseline; overflow: hidden; padding: .04em 0;
  font-size: clamp(40px, 19cqi, 80px); line-height: 1.05; letter-spacing: -.02em;
  font-variant-numeric: tabular-nums; font-weight: 760; font-variation-settings: 'wdth' 120, 'wght' 760, 'opsz' 96;
}
.d { display: inline-block; }
.d.roll { animation: roll .55s var(--spring); }
.sep { opacity: .5; margin: 0 .02em; transition: opacity .25s; }
.sep.blink { opacity: .2; }
@keyframes roll { from { transform: translateY(-55%); opacity: 0; } to { transform: none; opacity: 1; } }

.status {
  align-self: flex-start; border: 0;
  display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; padding: 7px 15px 8px 11px;
  border-radius: 999px; background: color-mix(in oklab, currentColor 11%, transparent);
  font-size: 15px; font-variation-settings: 'wght' 620;
  transition: border-radius .4s var(--spring), transform .4s var(--spring), background-color .2s;
}
.status:hover { background: color-mix(in oklab, currentColor 17%, transparent); }
.status:active { border-radius: 12px; transform: scale(.94); }
.dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--status-color, var(--error));
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--status-color, var(--error)) 28%, transparent);
  transition: background-color .3s, box-shadow .3s;
}

/* ---------- Fact ---------- */
.fact {
  background: var(--secondary-container); color: var(--on-secondary-container);
  border-radius: 36px; display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
}
.fact-count {
  font-size: 13px; font-variant-numeric: tabular-nums; opacity: .7;
  font-variation-settings: 'wght' 650;
}
.fact-text {
  font-size: 18.5px; line-height: 1.42; max-width: 46ch; min-height: 4.3em; margin: 4px 0 12px;
  font-variation-settings: 'wdth' 100, 'wght' 460, 'opsz' 19;
  transition: opacity .25s var(--emph), transform .45s var(--spring-soft), filter .25s;
}
.fact-text.out { opacity: 0; transform: translateY(8px); filter: blur(4px); }

.fact-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn-filled {
  display: inline-flex; align-items: center; gap: 8px;
  height: 52px; padding: 0 24px 0 18px; border: 0; border-radius: 26px;
  background: var(--primary); color: var(--on-primary);
  font-size: 16px; font-variation-settings: 'wdth' 105, 'wght' 640;
  transition: border-radius .45s var(--spring), transform .45s var(--spring);
}
.btn-filled:hover { border-radius: 18px; }
.btn-filled:active { border-radius: 12px; transform: scale(.96); }

.btn-tonal-ic {
  width: 52px; height: 52px; border: 0; border-radius: 26px;
  background: color-mix(in oklab, var(--on-secondary-container) 10%, transparent);
  color: var(--on-secondary-container);
  display: grid; place-items: center;
  transition: border-radius .45s var(--spring), transform .45s var(--spring), background-color .2s;
}
.btn-tonal-ic:hover { background: color-mix(in oklab, var(--on-secondary-container) 16%, transparent); border-radius: 18px; }
.btn-tonal-ic:active { border-radius: 12px; transform: scale(.92); }

.btn-icon { position: relative; width: 24px; height: 24px; display: grid; place-items: center; }
.btn-icon .ms { transition: opacity .15s, transform .3s var(--spring); }
.loader { position: absolute; inset: 2px; width: 20px; height: 20px; fill: currentColor; opacity: 0; transition: opacity .15s; }
.loading .btn-icon .ms { opacity: 0; transform: scale(.3) rotate(-90deg); }
.loading .loader { opacity: 1; animation: spin .9s linear infinite; }

/* ---------- Links: M3 Expressive Connected Button Group ---------- */
.links { display: flex; flex-direction: column; gap: 5px; }
.lbtn {
  display: flex; align-items: center; gap: 16px; min-width: 0;
  padding: 16px 20px 16px 16px; border-radius: 12px;
  background: var(--surface-3); text-decoration: none;
  transition: border-radius .5s var(--spring), flex-grow .5s var(--spring), background-color .2s, transform .4s var(--spring);
}
.lbtn:first-child { border-radius: 30px 30px 12px 12px; }
.lbtn:last-child  { border-radius: 12px 12px 30px 30px; }
.lbtn:hover { background: color-mix(in oklab, var(--primary-container) 75%, var(--surface-3)); }
.lbtn:active { border-radius: 30px; transform: scale(.985); }
.lbtn-ic {
  flex: none; width: 48px; height: 48px; border-radius: 24px;
  display: grid; place-items: center; background: var(--primary); color: var(--on-primary);
  transition: border-radius .5s var(--spring), transform .5s var(--spring);
}
.lbtn:hover .lbtn-ic { border-radius: 15px; transform: rotate(-6deg) scale(1.05); }
.lbtn-tx { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.lbtn-tx b { font-size: 18px; line-height: 1.25; font-weight: 700; font-variation-settings: 'wdth' 115, 'wght' 720; }
.lbtn-tx small { font-size: 14px; color: var(--on-surface-variant); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lbtn-arr {
  flex: none; width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center;
  background: color-mix(in oklab, var(--on-surface) 7%, transparent);
  color: var(--on-surface-variant);
  transition: transform .45s var(--spring), background-color .2s, color .2s;
}
.lbtn-arr .ms { font-size: 18px; }
.lbtn:hover .lbtn-arr {
  transform: translate(3px, -3px);
  background: var(--primary); color: var(--on-primary);
}

/* ---------- Comments (Comments.app) ---------- */
.comments {
  background: var(--comments-bg);
  border-radius: 36px; padding: 14px; min-height: 84px;
  border: 1px solid var(--outline-variant);
  transition: background-color .3s ease;
}

.foot {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  padding: 24px 12px 0; font-size: 14px; color: var(--on-surface-variant);
}

/* ---------- Desktop ---------- */
@media (min-width: 760px) {
  .wrap { padding: 20px 24px 48px; }
  .grid { grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
  .card { padding: 32px; }
  .hero { grid-column: 1 / 8; grid-row: 1 / 3; border-radius: 56px; padding: 40px; min-height: 430px; }
  .clock, .fact { grid-column: 8 / 13; }
  .links, .comments { grid-column: 1 / -1; }
  .links { flex-direction: row; }
  .lbtn { flex: 1 1 0; }
  .lbtn:first-child { border-radius: 30px 12px 12px 30px; }
  .lbtn:last-child  { border-radius: 12px 30px 30px 12px; }
  .lbtn:hover { flex-grow: 1.18; }
  .lbtn:active { flex-grow: 1.32; border-radius: 30px; }
  .comments { padding: 18px; }
}

::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
}
</style>

  <defs>

</svg>

<div class="wrap">
  <header class="bar">

      <div class="palette" id="palette" role="dialog" aria-label="Настройка палитры M3">

<script>
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const root = document.documentElement;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  /* ================= НАСТРОЙКИ ================= */
  const OWNER_TZ = null;

  const FACTS = [
    'Домен .su открыли в сентябре 1990 года, за год до распада СССР. Страны нет, а домен живёт.',
    'У осьминога три сердца и голубая кровь.',
    'С точки зрения ботаники банан — ягода, а клубника — нет.',
    'Первый компьютерный «баг» был настоящей молью: в 1947 году её нашли в реле Harvard Mark II.',
    'Сутки на Венере длятся дольше, чем её год.',
    'Акулы появились на Земле раньше, чем деревья.',
    'Мёд почти не портится: съедобный мёд находили в древнеегипетских гробницах.',
    'Android изначально задумывали как систему для цифровых камер.',
    'Национальное животное Шотландии — единорог.',
    'Фламинго розовые из-за пигментов в еде. Без них они бледнеют.',
    'Самая короткая война в истории, англо-занзибарская 1896 года, длилась меньше часа.',
    'Летом Эйфелева башня становится выше примерно на 15 см из-за теплового расширения.',
    'Первое видео на YouTube, «Me at the zoo», загрузили в апреле 2005 года.',
    'Material Design Google показал в 2014 году, а Material 3 Expressive — в 2025-м.',
    'На языке улитки тысячи крошечных зубов.',
    'Свет от Солнца летит до Земли около 8 минут 20 секунд.',
    'Ватикан — самая маленькая страна в мире.',
    'Кошки не чувствуют сладкий вкус.'
  ];

  const PALETTES = [
    { name: 'Роза', h: 350 },
    { name: 'Сирень', h: 295 },
    { name: 'Океан', h: 235 },
    { name: 'Мята', h: 165 },
    { name: 'Янтарь', h: 70 }
  ];

  const STATUSES = [
    { text: 'не писать!', color: 'var(--error)' },
    { text: 'дизайнит в M3', color: 'var(--ok)' },
    { text: 'кодит фичи', color: 'var(--warn)' },
    { text: 'афк / спит', color: 'var(--primary)' }
  ];

  /* ================= M3 Expressive Shapes + Morph ================= */
  const N = 180;
  const SHAPES = {
    circle:   { n: 0,  a: 0 },
    cookie9:  { n: 9,  a: 0.07 },
    clover4:  { n: 4,  a: 0.2 },
    sunny8:   { n: 8,  a: 0.1 },
    cookie12: { n: 12, a: 0.05 },
    burst6:   { n: 6,  a: 0.13 },
    flower7:  { n: 7,  a: 0.11 }
  };

  const radii = (s) => {
    const r = new Float64Array(N);
    for (let i = 0; i < N; i++) {
      const th = (i / N) * Math.PI * 2;
      r[i] = (1 + s.a * Math.cos(s.n * th)) / (1 + s.a);
    }
    return r;
  };
  const toPath = (r) => {
    let d = '';
    for (let i = 0; i < N; i++) {
      const th = (i / N) * Math.PI * 2;
      d += (i ? 'L' : 'M') + (0.5 + 0.5 * r[i] * Math.cos(th)).toFixed(4) + ' ' + (0.5 + 0.5 * r[i] * Math.sin(th)).toFixed(4);
    }
    return d + 'Z';
  };
  const springEase = (p) => (p >= 1 ? 1 : 1 - Math.exp(-6 * p) * Math.cos(10.5 * p));

  function shaper(el, start) {
    const st = { r: radii(SHAPES[start]), id: 0 };
    el.setAttribute('d', toPath(st.r));
    st.to = (name, dur) => {
      const target = radii(SHAPES[name]);
      const id = ++st.id;
      if (reduce || !dur) { st.r = target; el.setAttribute('d', toPath(target)); return; }
      const from = st.r.slice();
      const t0 = performance.now();
      const frame = (now) => {
        if (id !== st.id) return;
        const p = Math.min(1, Math.max(0, (now - t0) / dur));
        const t = springEase(p);
        for (let i = 0; i < N; i++) st.r[i] = from[i] + (target[i] - from[i]) * t;
        el.setAttribute('d', toPath(st.r));
        if (p < 1) requestAnimationFrame(frame);
      };
      requestAnimationFrame(frame);
    };
    return st;
  }

  /* ---------- Аватарка + Фоновый шейп + Пилюля формы ---------- */
  const avatar = shaper($('#avatarClipPath'), 'circle');
  const ambient = shaper($('#ambientPath'), 'clover4');
  const shapeNameEl = $('#shapeName');
  const avOrder = ['cookie9', 'clover4', 'sunny8', 'cookie12', 'burst6', 'flower7', 'circle'];
  let avIdx = 0;

  const cycleAvatarShape = () => {
    avIdx = (avIdx + 1) % avOrder.length;
    const nextShape = avOrder[avIdx];
    const ambientShape = avOrder[(avIdx + 2) % avOrder.length];
    avatar.to(nextShape, 750);
    ambient.to(ambientShape, 950);
    shapeNameEl.textContent = nextShape;
  };
  $('#avatarBtn').addEventListener('click', cycleAvatarShape);
  $('#shapePill').addEventListener('click', cycleAvatarShape);

  /* ---------- Интерактивный Roboto Flex в Hero ---------- */
  const heroCard = $('#heroCard');
  const heroName = $('#heroName');
  if (!reduce) {
    heroCard.addEventListener('pointermove', (e) => {
      const rect = heroCard.getBoundingClientRect();
      const nx = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const ny = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
      const wdth = Math.round(115 + nx * 36); // 115..151
      const wght = Math.round(700 + (1 - ny) * 280); // 700..980
      heroName.style.setProperty('--n-wdth', wdth);
      heroName.style.setProperty('--n-wght', wght);
    });
    heroCard.addEventListener('pointerleave', () => {
      heroName.style.setProperty('--n-wdth', 151);
      heroName.style.setProperty('--n-wght', 900);
    });
  }

  /* ---------- Loading Indicator ---------- */
  const loader = shaper($('#loaderPath'), 'cookie9');
  const loaderSeq = ['burst6', 'clover4', 'cookie9', 'sunny8', 'circle'];
  let loaderTimer = 0;
  const startLoader = () => {
    let k = 0;
    loader.to(loaderSeq[k], 260);
    loaderTimer = setInterval(() => { k = (k + 1) % loaderSeq.length; loader.to(loaderSeq[k], 260); }, 200);
  };
  const stopLoader = () => clearInterval(loaderTimer);

  /* ---------- Случайный факт + Копирование ---------- */
  const factText = $('#factText');
  const factBtn = $('#factBtn');
  const factCount = $('#factCount');
  const copyFactBtn = $('#copyFactBtn');
  const copyIcon = $('#copyIcon');
  let lastFact = -1, busy = false;

  const nextFact = () => {
    let i;
    do { i = Math.floor(Math.random() * FACTS.length); } while (i === lastFact && FACTS.length > 1);
    lastFact = i;
    factCount.textContent = `${i + 1} / ${FACTS.length}`;
    return FACTS[i];
  };
  factText.textContent = nextFact();

  factBtn.addEventListener('click', () => {
    if (busy) return;
    busy = true;
    factBtn.classList.add('loading');
    factBtn.setAttribute('aria-busy', 'true');
    startLoader();
    factText.classList.add('out');
    setTimeout(() => {
      factText.textContent = nextFact();
      factText.classList.remove('out');
      factBtn.classList.remove('loading');
      factBtn.removeAttribute('aria-busy');
      stopLoader();
      busy = false;
    }, reduce ? 0 : 560);
  });

  copyFactBtn.addEventListener('click', () => {
    if (!navigator.clipboard) return;
    navigator.clipboard.writeText(factText.textContent).then(() => {
      copyIcon.textContent = 'check';
      setTimeout(() => { copyIcon.textContent = 'content_copy'; }, 1400);
    }).catch(() => {});
  });

  /* ---------- Часы + Переключатель статуса ---------- */
  const digitEls = Array.from(document.querySelectorAll('.digits .d'));
  const sepEls = Array.from(document.querySelectorAll('.digits .sep'));
  const tzBadge = $('#tzBadge');
  try {
    const tzName = OWNER_TZ || Intl.DateTimeFormat().resolvedOptions().timeZone || 'LOCAL';
    tzBadge.textContent = tzName.split('/').pop().replace('_', ' ');
  } catch (e) {}

  const fmtOpts = { hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' };
  let fmt;
  try { fmt = new Intl.DateTimeFormat('ru-RU', OWNER_TZ ? Object.assign({ timeZone: OWNER_TZ }, fmtOpts) : fmtOpts); }
  catch (e) { fmt = new Intl.DateTimeFormat('ru-RU', fmtOpts); }

  let blinkState = false;
  const tick = () => {
    const parts = fmt.formatToParts(new Date());
    const get = (t) => ((parts.find((p) => p.type === t) || { value: '0' }).value).padStart(2, '0');
    const s = get('hour') + get('minute') + get('second');
    for (let i = 0; i < 6; i++) {
      const el = digitEls[i], c = s[i];
      if (el.textContent !== c) {
        el.textContent = c;
        if (!reduce) { el.classList.remove('roll'); void el.offsetWidth; el.classList.add('roll'); }
      }
    }
    blinkState = !blinkState;
    sepEls.forEach((sep) => sep.classList.toggle('blink', blinkState));
    setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
  };
  tick();

  let statusIdx = 0;
  const statusBtn = $('#statusBtn');
  const statusText = $('#statusText');
  statusBtn.addEventListener('click', () => {
    statusIdx = (statusIdx + 1) % STATUSES.length;
    const st = STATUSES[statusIdx];
    statusText.textContent = st.text;
    statusBtn.style.setProperty('--status-color', st.color);
  });

  /* ---------- Палитра (Swatches + Hue Slider + Vibrancy) ---------- */
  const palEl = $('#palette'), palSwatches = $('#palSwatches'), palBtn = $('#paletteBtn');
  const hueSlider = $('#hueSlider'), hueVal = $('#hueVal');
  const savedHue = parseFloat(store.get('shkbd:hue'));
  let baseHue = Number.isFinite(savedHue) ? ((savedHue % 360) + 360) % 360 : PALETTES[0].h;

  const syncSwatches = () => {
    palSwatches.querySelectorAll('.sw').forEach((b, i) => {
      b.setAttribute('aria-checked', String(Math.round(baseHue) === PALETTES[i].h));
    });
    hueSlider.value = Math.round(baseHue);
    hueVal.textContent = `${Math.round(baseHue)}°`;
  };

  PALETTES.forEach((p) => {
    const b = document.createElement('button');
    b.className = 'sw';
    b.type = 'button';
    b.setAttribute('role', 'radio');
    b.setAttribute('aria-label', p.name);
    b.title = p.name;
    b.style.setProperty('--sh', p.h);
    b.innerHTML = '<span class="ms">check</span>';
    b.addEventListener('click', () => setHue(p.h));
    palSwatches.appendChild(b);
  });
  syncSwatches();

  function setHue(h) {
    const cur = parseFloat(getComputedStyle(root).getPropertyValue('--h'));
    const target = Number.isFinite(cur) ? h + 360 * Math.round((cur - h) / 360) : h;
    root.style.setProperty('--h', target);
    baseHue = ((h % 360) + 360) % 360;
    store.set('shkbd:hue', Math.round(baseHue));
    syncSwatches();
  }

  hueSlider.addEventListener('input', (e) => {
    const h = parseFloat(e.target.value);
    root.style.setProperty('--h', h);
    baseHue = h;
    store.set('shkbd:hue', Math.round(h));
    syncSwatches();
  });

 // Переключатель насыщенности (Tonal / Expressive / Vibrant)
  const vibBtns = Array.from(document.querySelectorAll('.vib-btn'));
  const currentVib = root.dataset.vib || 'expressive';
  const syncVib = (v) => {
    vibBtns.forEach((btn) => btn.setAttribute('aria-pressed', String(btn.dataset.vib === v)));
  };
  syncVib(currentVib);
  vibBtns.forEach((btn) => {
    btn.addEventListener('click', () => {
      const v = btn.dataset.vib;
      root.dataset.vib = v;
      store.set('shkbd:vib', v);
      syncVib(v);
    });
  });

  const setPal = (open) => { palEl.classList.toggle('open', open); palBtn.setAttribute('aria-expanded', String(open)); };
  palBtn.addEventListener('click', (e) => { e.stopPropagation(); setPal(!palEl.classList.contains('open')); });
  document.addEventListener('click', (e) => { if (!palEl.contains(e.target)) setPal(false); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setPal(false); });

  /* ---------- Тема (круговой переход View Transitions) ---------- */
  const themeBtn = $('#themeBtn'), themeIcon = $('#themeIcon');
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const isDark = () => (root.dataset.theme ? root.dataset.theme === 'dark' : mq.matches);
  const syncIcon = () => { themeIcon.textContent = isDark() ? 'light_mode' : 'dark_mode'; };
  syncIcon();
  const onScheme = () => { syncIcon(); loadComments(isDark()); };
  if (mq.addEventListener) mq.addEventListener('change', onScheme); else if (mq.addListener) mq.addListener(onScheme);

  themeBtn.addEventListener('click', () => {
    const next = isDark() ? 'light' : 'dark';
    const apply = () => { root.dataset.theme = next; store.set('shkbd:theme', next); syncIcon(); loadComments(next === 'dark'); };
    if (!document.startViewTransition || reduce) { apply(); return; }
    const r = themeBtn.getBoundingClientRect();
    const x = r.left + r.width / 2, y = r.top + r.height / 2;
    const end = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    const vt = document.startViewTransition(apply);
    vt.ready.then(() => {
      root.animate(
        { clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${end}px at ${x}px ${y}px)`] },
        { duration: 650, easing: 'cubic-bezier(.2,0,0,1)', pseudoElement: '::view-transition-new(root)' }
      );
    }).catch(() => {});
  });

  /* ================= КОММЕНТАРИИ (Comments.app) ================= */
  const commentsContainer = $('#comments-container');
  let commentsDark = null;
  function loadComments(dark) {
    if (dark === commentsDark) return;
    commentsDark = dark;
    commentsContainer.innerHTML = '';
    const script = document.createElement('script');
    script.async = true;
    script.src = 'https://comments.app/js/widget.js?3';
    script.setAttribute('data-comments-app-website', 'H5q6PgQw');
    script.setAttribute('data-limit', '5');
    script.setAttribute('data-dislikes', '1');
    if (dark) {
      script.setAttribute('data-color', '72E350');
      script.setAttribute('data-dark', '1');
    } else {
      script.setAttribute('data-color', '29B127');
    }
    commentsContainer.appendChild(script);
  }
  loadComments(isDark());

  /* ---------- Вступление: аватар морфится в печеньку, имя растягивается ---------- */
  const intro = () => requestAnimationFrame(() => {
    root.classList.remove('pre');
    avatar.to('cookie9', 1100);
    ambient.to('sunny8', 1400);
    setTimeout(() => root.classList.add('ready'), 60);
  });
  const fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  Promise.race([fontsReady, new Promise((r) => setTimeout(r, 1200))]).then(intro, intro);
})();
</script>
